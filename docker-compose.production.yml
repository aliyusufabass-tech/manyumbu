services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manyumbu}
      POSTGRES_USER: ${POSTGRES_USER:-manyumbu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready/"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["sh", "scripts/start_worker.sh"]
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["sh", "scripts/start_beat.sh"]
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
