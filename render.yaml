services:
  - type: web
    name: manyumbu-api
    env: docker
    plan: starter
    healthCheckPath: /health/ready/
    envVars:
      - key: MANYUMBU_ENV
        value: production

      - key: DJANGO_DEBUG
        value: "0"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: redis
          name: manyumbu-redis
          property: connectionString

  - type: worker
    name: manyumbu-worker
    env: docker
    plan: starter
    dockerCommand: sh scripts/start_worker.sh
    envVars:
      - key: MANYUMBU_ENV
        value: production

      - key: DJANGO_DEBUG
        value: "0"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: redis
          name: manyumbu-redis
          property: connectionString

  - type: worker
    name: manyumbu-beat
    env: docker
    plan: starter
    dockerCommand: sh scripts/start_beat.sh
    envVars:
      - key: MANYUMBU_ENV
        value: production

      - key: DJANGO_DEBUG
        value: "0"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: redis
          name: manyumbu-redis
          property: connectionString

  - type: redis
    name: manyumbu-redis
    plan: starter
    ipAllowList: []